name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      firmware_repo:
        description: Firmware repository to run the integration tests on
        default: usetrmnl/trmnl-firmware
      firmware_ref:
        description: Branch, tag or SHA of the firmware
        default: main

env:
  CARGO_TERM_COLOR: always

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Headless build: no GUI toolkit needed on the runner.
      - name: format
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --no-default-features --all-targets

      - name: unit tests
        run: cargo test --workspace --no-default-features

  # The integration tests (trmnl-spec) on this commit of the simulator: its CI workflow builds
  # the firmware and the headless simulator and runs the suite.
  integration:
    needs: unit
    uses: usetrmnl/trmnl-spec/.github/workflows/ci.yml@main
    with:
      sim_repo: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      sim_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      firmware_repo: ${{ inputs.firmware_repo || 'usetrmnl/trmnl-firmware' }}
      firmware_ref: ${{ inputs.firmware_ref || 'main' }}

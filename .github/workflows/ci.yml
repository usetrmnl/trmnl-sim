name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Headless build: no GUI toolkit needed on the runner.
      - name: format
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --no-default-features --all-targets

      - name: unit tests
        run: cargo test --workspace --no-default-features

  # The firmware's integration tests (its spec/ suite, one job per env) on this commit of the
  # simulator.
  integration:
    uses: usetrmnl/trmnl-firmware/.github/workflows/integration.yml@main
    with:
      sim_repo: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      sim_ref: ${{ github.event.pull_request.head.sha || github.sha }}

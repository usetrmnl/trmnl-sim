name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      firmware_repo:
        description: Firmware repository to build and test
        default: usetrmnl/trmnl-firmware
      firmware_ref:
        description: Branch, tag or SHA of the firmware
        default: main
  # Lets the firmware repository run these tests against its own PRs.
  workflow_call:
    inputs:
      firmware_repo:
        type: string
        default: usetrmnl/trmnl-firmware
      firmware_ref:
        type: string
        default: main
      sim_repo:
        description: trmnl-sim repository to use when called from another repository
        type: string
        default: usetrmnl/trmnl-sim
      sim_ref:
        description: trmnl-sim ref to use when called from another repository
        type: string
        default: main

env:
  CARGO_TERM_COLOR: always

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.sim_repo || github.repository }}
          ref: ${{ inputs.sim_ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Headless build: no GUI toolkit needed on the runner.
      - name: format
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --no-default-features --all-targets

      - name: unit tests
        run: cargo test --workspace --no-default-features

  integration:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.sim_repo || github.repository }}
          ref: ${{ inputs.sim_ref || github.ref }}
          path: trmnl-sim

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.firmware_repo || 'usetrmnl/trmnl-firmware' }}
          ref: ${{ inputs.firmware_ref || 'main' }}
          path: trmnl-firmware

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('trmnl-firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PlatformIO Core and the ESP32 ROM images
        run: |
          pip install --upgrade platformio==6.1.19
          pio pkg install -g -t platformio/tool-esp-rom-elfs

      - name: Build firmware (trmnl)
        run: pio run -d trmnl-firmware -e trmnl -j 4

      - name: Build firmware (trmnl_4clr)
        run: pio run -d trmnl-firmware -e trmnl_4clr -j 4

      # Also fetches the filesystem image (with the ESP32-C5 modem firmware) via post_build_x.py.
      - name: Build firmware (TRMNL_X)
        run: pio run -d trmnl-firmware -e TRMNL_X -j 4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: trmnl-sim

      - name: Build simulator (headless)
        run: cargo build --release --no-default-features --manifest-path trmnl-sim/Cargo.toml

      - name: Integration tests
        working-directory: trmnl-sim/tests/integration
        env:
          TRMNL_FIRMWARE_BUILD: ${{ github.workspace }}/trmnl-firmware/.pio/build/trmnl
          TRMNL_X_BUILD: ${{ github.workspace }}/trmnl-firmware/.pio/build/TRMNL_X
          TRMNL_BWRY_BUILD: ${{ github.workspace }}/trmnl-firmware/.pio/build/trmnl_4clr
          TRMNL_SIM_ARTIFACTS: ${{ github.workspace }}/sim-artifacts
          FORCE_COLOR: "1"
        run: python run.py -v

      - name: Collect screen diffs
        if: failure()
        run: cp trmnl-sim/tests/integration/golden/*.actual.png sim-artifacts/ 2>/dev/null || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: simulator-logs-and-screens
          path: sim-artifacts/
          if-no-files-found: ignore

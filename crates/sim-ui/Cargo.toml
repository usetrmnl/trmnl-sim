[package]
name = "sim-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5"
eframe = "0.36.2"
egui = "0.36.2"
mock-trmnl = { path = "../mock-trmnl" }
parking_lot = "0.12.5"
png = "0.18.1"
rfd = "0.17.2"
serde_json = "1.0.151"
sim-api = { version = "0.1.0", path = "../sim-api" }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

# The Portal tab's embedded system webview (WKWebView, WebView2). Not on Linux, where it would
# make WebKitGTK a build and run dependency of the window: the tab links to the browser there.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "0.57", default-features = false, features = ["os-webview"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }

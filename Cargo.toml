[workspace]
members = ["crates/*"]

[package]
name = "trmnl-sim"
version = "0.1.0"
edition = "2024"

[features]
default = ["gui"]
# The desktop window. Build with --no-default-features for headless/CI use.
gui = ["dep:sim-ui"]

[dependencies]
sim-api = { path = "crates/sim-api" }
sim-ui = { path = "crates/sim-ui", optional = true }
sim-control = { path = "crates/sim-control" }
mock-trmnl = { path = "crates/mock-trmnl" }
vnet = { path = "crates/vnet" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossbeam-channel = "0.5.17"
env_logger = "0.11.11"
flate2 = "1.1.10"
log = "0.4.34"
object = "0.40.0"
parking_lot = "0.12.5"
rand = "0.10.3"
serde_json = "1.0.151"
aes = "0.8"
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
gimli = { version = "0.34", default-features = false, features = ["read", "std"] }
cpp_demangle = "0.5"

[profile.dev]
opt-level = 2

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"
